[project]
name = "algorithms-and-patterns"
version = "0.1.0"
description = "アルゴリズムと設計パターンの Python 実装"
requires-python = ">=3.11"
# 標準ライブラリだけで書いている。実行に要る依存は無い。
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithms_and_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
# import の並べ替えで、このパッケージを「自分のもの」として扱わせる。
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
