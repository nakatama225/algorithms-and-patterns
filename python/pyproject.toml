[project]
name = "algorithms-and-patterns"
version = "0.1.0"
description = "アルゴリズムと設計パターンの Python 実装"
requires-python = ">=3.11"
# 標準ライブラリだけで書いている。実行に要る依存は無い。
dependencies = []

[dependency-groups]
dev = [
    # 下の exhaustive-match は 1.17 からある。それより古い mypy はこの名前を知らず、
    # 設定に書いても1行の警告を出すだけで、検査を切ったまま通る。
    "mypy>=1.17",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithms_and_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
# import の並べ替えで、このパッケージを「自分のもの」として扱わせる。
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
# 値を返さない match の書き忘れは、strict でも見つからない（既定では切ってある）。
# case _: の無い match で、扱っていない種類が残っていれば止める（README の State）。
enable_error_code = ["exhaustive-match"]
